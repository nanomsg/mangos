name: race
on: [push, pull_request]
jobs:
  test:
    name: race and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...
